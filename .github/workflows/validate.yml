name: Validate PWA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/validate.mjs
      - name: Check JavaScript syntax
        run: |
          for file in \
            storage.js \
            core.js \
            photo.js \
            video.js \
            ui.js \
            fullscreen.js \
            camera-enhancements-core.js \
            camera-devices.js \
            camera-controls.js \
            camera-capture.js \
            camera-enhancements.js \
            service-worker.js; do
            node --check "$file"
          done
