name: Validate PWA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: All source, unit, audit, and syntax checks
        run: node tests/run-all.mjs

  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QC_PC_HEADED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Japanese font support for rendered UI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match -f '%{family}\n' 'sans-serif:lang=ja'
      - name: Desktop input and controls preflight
        env:
          QUIET_CAMERA_PC_BUTTONS_TEST_OUTPUT: test-results/pc-preflight
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" node tests/pc-buttons-browser.test.mjs
      - name: Owned renderer crash preflight
        env:
          QC_RECORDING_FILTER: renderer crash
          QC_RECORDING_BROWSER_OUTPUT: test-results/crash-preflight
        run: node tests/recording-safety-browser.test.mjs
      - name: Japanese desktop-label preflight
        env:
          QC_REVIEW_HISTORY_FILTER: ^P8
          QC_REVIEW_HISTORY_OUTPUT: test-results/labels-preflight
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" node tests/review-history-regression-browser.test.mjs
      - name: Synthetic browser and aggregate regressions
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -nolisten tcp" node tests/run-all.mjs --browser
      - name: Preserve synthetic regression failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-regression-evidence
          path: |
            test-results/**/*.json
            test-results/**/*.png
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, browser-regressions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: quiet-camera-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the tested commit is still main
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_main" = "$GITHUB_SHA"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble the tested application
        run: |
          mkdir -p _site
          cp index.html privacy.html service-worker.js manifest.webmanifest sitemap.xml LICENSE _site/
          cp -R assets icons images _site/
          touch _site/.nojekyll
      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
