name: Validate PWA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/validate.mjs
      - run: node --check storage.js
      - run: node --check core.js
      - run: node --check photo.js
      - run: node --check video.js
      - run: node --check ui.js
      - run: node --check service-worker.js
