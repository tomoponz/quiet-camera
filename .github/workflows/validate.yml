name: Validate PWA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate references and PWA wiring
        run: node tests/validate.mjs
      - name: Camera constraint regression tests
        run: node tests/camera-controls.test.cjs
      - name: Video bitrate regression tests
        run: node tests/video-bitrate.test.cjs
      - name: Service Worker failure-path tests
        run: node tests/service-worker.test.cjs
      - name: IndexedDB blocked-open tests
        run: node tests/storage.test.cjs
      - name: Check every application script
        run: |
          for file in \
            storage.js \
            core.js \
            photo.js \
            video.js \
            ui.js \
            fullscreen.js \
            camera-enhancements-core.js \
            camera-devices.js \
            camera-controls.js \
            camera-capture.js \
            camera-enhancements.js \
            service-worker.js; do
            echo "Checking $file"
            node --check "$file"
          done
